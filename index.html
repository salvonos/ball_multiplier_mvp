<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ball Multiplier MVP</title>
  <link rel="stylesheet" href="style.css?v=014" />
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>
  <div class="app">
    <div class="hud">
      <div><div class="label">BALLS</div><div id="ballCount" class="value">5</div></div>
      <div class="title">MULTIPLY</div>
      <button id="restartBtn">RESTART</button>
    </div>
    <div id="gameWrap"><canvas id="game"></canvas><button id="dropBtn">DROP 5 BALLS</button></div>
    <div class="footer">
      <div>Collected: <strong id="collected">0</strong></div>
      <div id="version">v0.1.4</div>
      <div id="status">Ready</div>
    </div>
  </div>
  <script src="game.js?v=014"></script>
</body>
</html>
